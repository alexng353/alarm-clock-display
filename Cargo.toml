[package]
name = "display"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false }
chrono-tz = { version = "0.10.4", default-features = false }
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1.0"
rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.12", features = ["rt", "critical-section-impl"] }

usb-device = "0.3"
usbd-serial = "0.2"

[[bin]]
name = "display"
path = "src/main.rs"
test = false
bench = false
